# Local production-like stack: `docker compose up --build`, then open http://localhost:3000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: convoly
      POSTGRES_PASSWORD: convoly
      POSTGRES_DB: convoly
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U convoly"]
      interval: 5s
      retries: 10
  app:
    build: .
    ports: ["3000:3000"]
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://convoly:convoly@db:5432/convoly
      APP_URL: ${APP_URL:-http://localhost:3000}
      APP_SECRET: ${APP_SECRET:-change-me-to-a-long-random-string-of-48-chars-min}
volumes:
  pgdata:
