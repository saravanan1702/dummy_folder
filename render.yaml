# One-click deploy on Render: New → Blueprint → pick this repo.
# Creates a Postgres database and the web service; migrations run on start.
databases:
  - name: convoly-db
    plan: basic-256mb
    databaseName: convoly
    user: convoly

services:
  - type: web
    name: convoly
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: convoly-db, property: connectionString }
      - key: APP_SECRET
        generateValue: true
      # APP_URL defaults to the service's onrender.com address. Set it when you add a custom domain.
      - key: SUPERADMIN_EMAILS
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_BUSINESS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
